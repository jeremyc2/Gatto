[package]
name = "gatto"
version = "0.17.7"
edition = "2024"
default-run = "gatto"
rust-version = "1.90"
description = "A lightweight GPUI menu bar app for uploading GitHub image and video attachments"
license = "MIT"
readme = "README.md"

[features]
walkthrough-screenshots = ["gpui-kit/test-support"]

[[bin]]
name = "walkthrough-screenshots"
path = "src/walkthrough_screenshots.rs"
required-features = ["walkthrough-screenshots"]

[[bin]]
name = "platform-tests"
path = "src/platform_tests.rs"
required-features = ["walkthrough-screenshots"]

[dependencies]
anyhow = "1"
async-channel = "2"
gpui-kit = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.12.0"
unicode-segmentation = "1.13.3"
tempfile = { version = "3", default-features = false }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
core-text = "22"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSData", "NSBundle", "NSDictionary", "NSString", "NSURL", "NSError",
  "NSPropertyList", "NSJSONSerialization", "NSValue", "NSArray",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSAppearance",
  "NSImage",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "NSGraphics",
  "NSBezierPath",
  "NSColor",
  "NSCursor",
  "NSFont",
  "NSAttributedString",
  "NSStringDrawing",
  "NSView",
  "NSWindow",
  "NSRunningApplication",
  "NSResponder",
  "NSWorkspace",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std", "AVAsset", "AVAssetTrack", "AVAssetReader", "AVAssetReaderOutput",
  "AVAssetWriter", "AVAssetWriterInput", "AVAsynchronousKeyValueLoading",
  "AVMediaFormat", "AVVideoSettings", "objc2-core-foundation",
  "objc2-core-media", "objc2-core-video", "block2",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "VTCompressionProperties"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }

[profile.release]
lto = "thin"
strip = true
