name: Bug report
description: Report a reproducible problem with the app
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove tokens, private repository details, and confidential images before submitting.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.1, Apple silicon
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Stage an image
        3. Select a repository
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Do not include credentials, private repository names, private URLs, or confidential images.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
        - label: I removed sensitive information from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
