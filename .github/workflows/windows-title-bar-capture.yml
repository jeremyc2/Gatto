name: Windows title bar capture

on:
  push:
    branches: [codex/windows-title-bar]
    paths: [.github/workflows/windows-title-bar-capture.yml, scripts/capture-windows-title-bar.ps1, src/app.rs, src/main.rs]

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Windows app with sample data
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin Gatto --features walkthrough-screenshots
      - name: Capture the Windows desktop and exercise the caption
        shell: pwsh
        run: ./scripts/capture-windows-title-bar.ps1 -Executable target/x86_64-pc-windows-msvc/release/Gatto.exe -OutputDirectory "$env:RUNNER_TEMP/gatto-capture"
      - name: Upload Windows captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gatto-windows-title-bar
          path: ${{ runner.temp }}/gatto-capture/
          if-no-files-found: error
