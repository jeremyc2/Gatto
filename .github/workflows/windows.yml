name: Windows build

on:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "Cargo.*"
      - "build.rs"
      - "rust-toolchain.toml"
      - "src/**"
      - "schemas/**"
      - "packaging/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Windows executable
        run: cargo build --locked --release --bin Gatto
      - name: Upload the Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Gatto-windows-x64
          path: target/release/Gatto.exe
          if-no-files-found: error
      - name: Test the Windows executable
        run: cargo test --locked --bin Gatto
