name: Windows timestamp probe

on:
  workflow_dispatch:
    inputs:
      build_only:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  timestamp:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the actual timestamp module tests in isolation
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gatto-timestamp-probe'
          New-Item -ItemType Directory -Path "$probe/src" -Force | Out-Null
          @'
          [package]
          name = "gatto-timestamp-probe"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Time"] }
          '@ | Set-Content "$probe/Cargo.toml"
          Copy-Item src/desktop/windows/timestamp.rs "$probe/src/lib.rs"
          cargo test --manifest-path "$probe/Cargo.toml" -- --nocapture
