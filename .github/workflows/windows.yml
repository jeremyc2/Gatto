name: Windows release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Windows preview number for this Gatto version
        type: string
        default: "1"
        required: true
      build_only:
        description: Build the installer, ZIP, and checksums without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate preview number
        shell: pwsh
        env:
          PREVIEW_NUMBER: ${{ inputs.preview }}
        run: |
          if ($env:PREVIEW_NUMBER -cnotmatch '^[1-9][0-9]{0,5}$') {
            throw 'Enter a preview number between 1 and 999999.'
          }
      - name: Build the Windows executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin Gatto
      - name: Test the Windows app
        # Keep GPUI's debug selectors while timing optimized editor code.
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --bin Gatto
      - name: Package the Windows release
        id: package
        shell: pwsh
        env:
          PREVIEW_NUMBER: ${{ inputs.preview }}
        run: ./packaging/windows/package.ps1 -Preview $env:PREVIEW_NUMBER -Executable target/x86_64-pc-windows-msvc/release/Gatto.exe -ReleaseDirectory release
      - name: Save the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Gatto-windows-x64
          path: release/
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Gatto-windows-x64
          path: release
      - name: Publish the Windows prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum --strict --check SHA256SUMS

          status=0
          git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" || status=$?
          case "$status" in
            0) echo "Tag $RELEASE_TAG already exists. Choose a new preview number." >&2; exit 1 ;;
            2) ;;
            *) exit "$status" ;;
          esac

          cat > notes.md <<'NOTES'
          Unsigned Windows 11 x64 preview. Run the setup EXE for a per-user
          install with Explorer and gatto:// support, or extract the portable ZIP
          and open Gatto.exe. Quit Gatto from its tray icon before upgrading.
          If Windows reports that VCRUNTIME140.dll is missing, install the
          [Microsoft Visual C++ Redistributable for x64](https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist).
          GitHub CLI authentication is required to upload attachments.
          NOTES

          gh release create "$RELEASE_TAG" Gatto-windows-x64-*.zip Gatto-windows-x64-*-setup.exe SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Gatto Windows x64 ${RELEASE_TAG#windows-v}" \
            --notes-file notes.md --prerelease --latest=false
